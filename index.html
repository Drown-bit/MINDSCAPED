<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindScape</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6fb;
            color: #222;
        }
        header {
            background: #3a4ca8;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
        }
        nav {
            margin: 0 auto;
            max-width: 900px;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #ffd700;
        }
        .hero {
            max-width: 900px;
            margin: 2rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            text-align: center;
        }
        .hero h1 {
            margin-top: 0;
            color: #3a4ca8;
        }
        .hero p {
            font-size: 1.2rem;
            color: #444;
        }
        footer {
            background: #222;
            color: #fff;
            text-align: center;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        @media (max-width: 600px) {
            .hero, nav {
                flex-direction: column;
                gap: 1rem;
            }
            .hero {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Features</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <section class="hero">
        <h1>Welcome to MindScape</h1>
        <p>Your journey to a clearer mind starts here. Explore our features and discover how MindScape can help you organize your thoughts and boost your productivity.</p>
        <a href="#" style="display:inline-block;margin-top:1.5rem;padding:0.75rem 2rem;background:#3a4ca8;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">Get Started</a>
    </section>
    <footer>
        &copy; 2026 MindScape. All rights reserved.
    </footer>
</body>
</html>
